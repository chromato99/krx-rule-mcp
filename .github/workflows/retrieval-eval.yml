name: MCP retrieval evaluation

on:
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: Exact Markdown corpus commit SHA matching the index
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retrieval-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-vector:
    runs-on: [self-hosted, linux, x64, krx-rag-eval]
    timeout-minutes: 30
    environment: rag-release
    steps:
      - name: Require immutable corpus revision
        env:
          CORPUS_REF: ${{ inputs.corpus_ref }}
        run: '[[ "$CORPUS_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out MCP server
        uses: actions/checkout@v4
        with:
          path: krx-rule-mcp

      - name: Check out pinned Markdown corpus
        uses: actions/checkout@v4
        with:
          repository: chromato99/krx-rule-markdown
          ref: ${{ inputs.corpus_ref }}
          path: krx-rule-markdown

      - uses: actions/setup-go@v5
        with:
          go-version-file: krx-rule-mcp/go.mod
          cache-dependency-path: krx-rule-mcp/go.sum

      - name: Verify repository default full-vector generation
        working-directory: krx-rule-mcp
        env:
          KRX_RULE_DATA_DIR: ${{ github.workspace }}/krx-rule-markdown/data
          KRX_RULE_INDEX_DIR: ${{ github.workspace }}/krx-rule-mcp/index
          KRX_EMBEDDING_MODEL: intfloat/multilingual-e5-small
          KRX_EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
          KRX_EMBEDDING_DIMENSIONS: "384"
          KRX_EMBEDDING_QUERY_PREFIX: "query: "
          KRX_EMBEDDING_DOCUMENT_PREFIX: "passage: "
          KRX_EMBEDDING_INPUT_FORMAT: text-v1
        run: |
          go run ./cmd/krx-rule-index \
            --data-dir "$KRX_RULE_DATA_DIR" \
            --index-dir "$KRX_RULE_INDEX_DIR" \
            --vector \
            --check --require-full-vector

      - name: Run protected full-vector retrieval regression gate
        working-directory: krx-rule-mcp
        env:
          KRX_RULE_DATA_DIR: ${{ github.workspace }}/krx-rule-markdown/data
          KRX_RULE_INDEX_DIR: ${{ github.workspace }}/krx-rule-mcp/index
          KRX_RULE_SERVER_COMMIT: ${{ github.sha }}
          KRX_EMBEDDING_BASE_URL: ${{ vars.KRX_RAG_EVAL_EMBEDDING_BASE_URL || 'http://127.0.0.1:18081/v1' }}
          OPENAI_API_KEY: ${{ secrets.KRX_RAG_EVAL_API_KEY }}
          KRX_EMBEDDING_MODEL: intfloat/multilingual-e5-small
          KRX_EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
          KRX_EMBEDDING_DIMENSIONS: "384"
          KRX_EMBEDDING_QUERY_PREFIX: "query: "
          KRX_EMBEDDING_DOCUMENT_PREFIX: "passage: "
          KRX_EMBEDDING_INPUT_FORMAT: text-v1
        run: |
          mkdir -p eval/results
          fixture=eval/fixtures/retrieval.json

          go run ./cmd/krx-rule-eval \
            --data-dir "$KRX_RULE_DATA_DIR" \
            --index-dir "$KRX_RULE_INDEX_DIR" \
            --fixture "$fixture" \
            --baseline eval/baselines/retrieval.json \
            --vector --require-vector --fail-on-gate \
            --output eval/results/retrieval.json

      - name: Record evaluation summary
        if: always()
        working-directory: krx-rule-mcp
        run: |
          if [ ! -f eval/results/retrieval.json ]; then
            exit 0
          fi
          jq '{provenance, failure_stage_counts, summary, language_summaries, split_summaries, language_split_summaries}' eval/results/retrieval.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-${{ github.sha }}
          path: krx-rule-mcp/eval/results/*.json
          if-no-files-found: error
          retention-days: 30
