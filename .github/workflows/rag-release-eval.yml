name: RAG release evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-release-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-vector:
    runs-on: [self-hosted, linux, x64, krx-rag-eval]
    timeout-minutes: 30
    environment: rag-release
    steps:
      - name: Check out MCP server
        uses: actions/checkout@v4
        with:
          path: krx-rule-mcp

      - name: Check out pinned Markdown corpus
        uses: actions/checkout@v4
        with:
          repository: chromato99/krx-rule-markdown
          ref: 2261bdb088e649ef15932527e7b2ebe8f56dd3e8
          path: krx-rule-markdown

      - uses: actions/setup-go@v5
        with:
          go-version-file: krx-rule-mcp/go.mod
          cache-dependency-path: krx-rule-mcp/go.sum

      - name: Verify pinned full-vector generation
        working-directory: krx-rule-mcp
        env:
          KRX_RULE_DATA_DIR: ${{ github.workspace }}/krx-rule-markdown/data
          KRX_RULE_INDEX_DIR: ${{ github.workspace }}/krx-rule-mcp/index
          KRX_EMBEDDING_MODEL: intfloat/multilingual-e5-small
          KRX_EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
          KRX_EMBEDDING_DIMENSIONS: "384"
          KRX_EMBEDDING_QUERY_PREFIX: "query: "
          KRX_EMBEDDING_DOCUMENT_PREFIX: "passage: "
          KRX_EMBEDDING_INPUT_FORMAT: text-v1
        run: |
          go run ./cmd/krx-rule-index \
            --data-dir "$KRX_RULE_DATA_DIR" \
            --index-dir "$KRX_RULE_INDEX_DIR" \
            --vector \
            --check --require-full-vector

      - name: Run protected full-vector quality gate
        working-directory: krx-rule-mcp
        env:
          KRX_RULE_DATA_DIR: ${{ github.workspace }}/krx-rule-markdown/data
          KRX_RULE_INDEX_DIR: ${{ github.workspace }}/krx-rule-mcp/index
          KRX_RULE_SERVER_COMMIT: ${{ github.sha }}
          KRX_EMBEDDING_BASE_URL: ${{ vars.KRX_RAG_EVAL_EMBEDDING_BASE_URL || 'http://127.0.0.1:18081/v1' }}
          OPENAI_API_KEY: ${{ secrets.KRX_RAG_EVAL_API_KEY }}
          KRX_EMBEDDING_MODEL: intfloat/multilingual-e5-small
          KRX_EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
          KRX_EMBEDDING_DIMENSIONS: "384"
          KRX_EMBEDDING_QUERY_PREFIX: "query: "
          KRX_EMBEDDING_DOCUMENT_PREFIX: "passage: "
          KRX_EMBEDDING_INPUT_FORMAT: text-v1
        run: |
          mkdir -p eval/results
          go run ./cmd/krx-rule-eval \
            --data-dir "$KRX_RULE_DATA_DIR" \
            --index-dir "$KRX_RULE_INDEX_DIR" \
            --english-baseline eval/baselines/rag-v1-e5-english.json \
            --vector --require-vector --fail-on-gate \
            --output eval/results/rag-v1-vector.json

      - name: Record metric diff
        if: always()
        working-directory: krx-rule-mcp
        run: |
          if [ ! -f eval/results/rag-v1-vector.json ]; then
            exit 0
          fi
          jq -n \
            --slurpfile baseline eval/baselines/rag-v1-text-vector.json \
            --slurpfile current eval/results/rag-v1-vector.json \
            'def comparable_keys: [
              "evaluator_version",
              "corpus_release_hash",
              "index_generation",
              "index_source_hash",
              "index_build_hash",
              "indexer_version",
              "bm25_artifact_digest",
              "bm25_snapshot_version",
              "embedding",
              "reranker",
              "lexicon_digest",
              "runtime_vector_mode",
              "retrieval_candidate_limit",
              "retrieval_contract",
              "answerability_gate",
              "fixture_version",
              "fixture_sha256",
              "source_fixture_sha256"
            ];
            [comparable_keys[] as $key |
              select($baseline[0].provenance[$key] != $current[0].provenance[$key]) |
              $key
            ] as $incompatible |
            {
              comparable: ($incompatible | length == 0),
              incompatible_provenance_fields: $incompatible,
              baseline_provenance: $baseline[0].provenance,
              current_provenance: $current[0].provenance,
              korean_summary_delta: (if ($incompatible | length) == 0 then {
                document_hit_at_5_rate: ($current[0].language_summaries.ko.document_hit_at_5_rate - $baseline[0].language_summaries.ko.document_hit_at_5_rate),
                mrr_at_5: ($current[0].language_summaries.ko.mrr_at_5 - $baseline[0].language_summaries.ko.mrr_at_5),
                evidence_hit_at_1_rate: ($current[0].language_summaries.ko.evidence_hit_at_1_rate - $baseline[0].language_summaries.ko.evidence_hit_at_1_rate),
                evidence_recall_at_3_rate: ($current[0].language_summaries.ko.evidence_recall_at_3_rate - $baseline[0].language_summaries.ko.evidence_recall_at_3_rate),
                candidate_evidence_recall_at_64_rate: ($current[0].language_summaries.ko.candidate_evidence_recall_at_64_rate - $baseline[0].language_summaries.ko.candidate_evidence_recall_at_64_rate),
                reranker_pool_hit_rate: ($current[0].language_summaries.ko.reranker_pool_hit_rate - $baseline[0].language_summaries.ko.reranker_pool_hit_rate),
                insufficient_refusal_rate: ($current[0].language_summaries.ko.insufficient_refusal_rate - $baseline[0].language_summaries.ko.insufficient_refusal_rate),
                p95_search_latency_ms: ($current[0].language_summaries.ko.p95_search_latency_ms - $baseline[0].language_summaries.ko.p95_search_latency_ms),
                p95_reranker_latency_ms: ($current[0].language_summaries.ko.p95_reranker_latency_ms - $baseline[0].language_summaries.ko.p95_reranker_latency_ms),
                p95_evaluation_latency_ms: ($current[0].language_summaries.ko.p95_latency_ms - $baseline[0].language_summaries.ko.p95_latency_ms)
              } else null end)
            }' > eval/results/rag-v1-vector-diff.json
          jq '{provenance, summary, korean: .language_summaries.ko, korean_holdout: .language_split_summaries.ko.holdout, english: .language_summaries.en, english_holdout: .language_split_summaries.en.holdout}' eval/results/rag-v1-vector.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-release-eval-${{ github.sha }}
          path: krx-rule-mcp/eval/results/*.json
          if-no-files-found: error
          retention-days: 30
